name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python 3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # The floor is the measured coverage rounded down less two, so a real
      # regression fails the build and an ordinary refactor does not.
      - name: Run tests with coverage
        run: >
          uv run pytest -q --cov=src/hand_controller --cov-report=term-missing
          --cov-fail-under=96

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy
